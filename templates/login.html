<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8"><title>SCADA - Đăng Nhập</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #e9ecef; height: 100vh; display: flex; align-items: center; justify-content: center; }
        .login-box { background: #fff; padding: 40px; border: 2px solid #adb5bd; width: 400px; }
        .banner { background: #00bfff; font-weight: bold; text-align: center; padding: 10px; border: 2px solid #000; margin-bottom: 20px; }
    </style>
</head>
<body>
    <div class="login-box">
        <div class="banner"><h3>BÃI ĐỖ XE THÔNG MINH</h3></div>
        {% if error %}<div class="alert alert-danger text-center">{{ error }}</div>{% endif %}
        <form action="/login" method="POST">
            <div class="mb-3"><label class="form-label">Tài khoản</label><input type="text" class="form-control" name="username" required autofocus></div>
            <div class="mb-3"><label class="form-label">Mật khẩu</label><input type="password" class="form-control" name="password" required></div>
            <button type="submit" class="btn btn-primary w-100">ĐĂNG NHẬP</button>
        </form>
    </div>
</body>
</html>
